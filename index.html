<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fin 📊 持仓日报</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg: oklch(0.13 0.005 260);
    --bg-elevated: oklch(0.17 0.005 260);
    --bg-hover: oklch(0.20 0.005 260);
    --border: oklch(0.25 0.005 260);
    --border-subtle: oklch(0.20 0.005 260);
    --text: oklch(0.93 0.005 260);
    --text-secondary: oklch(0.60 0.005 260);
    --text-muted: oklch(0.45 0.005 260);
    --gold: oklch(0.80 0.15 85);
    --gold-dim: oklch(0.65 0.12 85);
    --gold-glow: oklch(0.80 0.15 85 / 0.15);
    --red: oklch(0.65 0.2 25);
    --red-bg: oklch(0.65 0.2 25 / 0.1);
    --green: oklch(0.70 0.17 155);
    --green-bg: oklch(0.70 0.17 155 / 0.1);
    --blue: oklch(0.70 0.15 250);
    --blue-bg: oklch(0.70 0.15 250 / 0.1);
    --radius: 10px;
    --font: 'Inter', -apple-system, system-ui, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 32px 0 24px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: oklch(0.15 0 0);
    overflow: hidden;
  }

  .brand h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .brand h1 span {
    color: var(--gold);
  }

  .brand .subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  /* Date Nav */
  .date-nav {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    padding: 4px;
  }

  .date-nav button {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 150ms;
    display: flex;
    align-items: center;
  }

  .date-nav button:hover {
    background: var(--bg-hover);
    color: var(--text);
  }

  .date-nav .current-date {
    font-size: 13px;
    font-weight: 500;
    font-family: var(--mono);
    min-width: 150px;
    text-align: center;
    color: var(--text);
  }

  /* Tabs */
  .tab-bar {
    display: flex;
    gap: 2px;
    margin: 20px 0 28px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    padding: 4px;
    width: fit-content;
  }

  .tab {
    padding: 8px 20px;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    font-family: var(--font);
    border-radius: 6px;
    transition: all 200ms;
  }

  .tab:hover { color: var(--text); }

  .tab.active {
    background: var(--gold-glow);
    color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold-dim);
  }

  /* Sections */
  .section {
    margin-bottom: 20px;
    animation: fadeIn 400ms ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
  }

  .section-header i { width: 16px; height: 16px; }

  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    padding: 20px;
    transition: border-color 200ms;
  }

  .card:hover { border-color: var(--border); }

  /* Stock Grid */
  .stock-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 12px;
  }

  .stock-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    padding: 16px 18px;
    transition: all 200ms;
    cursor: default;
  }

  .stock-card:hover {
    border-color: var(--border);
    transform: translateY(-1px);
  }

  .stock-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .stock-name {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 2px;
  }

  .stock-code {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
  }

  .stock-price {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
    text-align: right;
  }

  .stock-change {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    text-align: right;
    margin-top: 2px;
    padding: 2px 6px;
    border-radius: 4px;
    display: inline-block;
    float: right;
  }

  .up .stock-price { color: var(--red); }
  .up .stock-change { color: var(--red); background: var(--red-bg); }
  .down .stock-price { color: var(--green); }
  .down .stock-change { color: var(--green); background: var(--green-bg); }
  .flat .stock-price { color: var(--text-secondary); }
  .flat .stock-change { color: var(--text-secondary); background: var(--bg-hover); }

  .stock-note {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border-subtle);
    line-height: 1.5;
  }

  /* Content */
  .content {
    line-height: 1.8;
    font-size: 14px;
    color: var(--text-secondary);
  }

  .content h3 {
    font-size: 14px;
    font-weight: 600;
    color: var(--gold);
    margin: 16px 0 6px;
  }

  .content h3:first-child { margin-top: 0; }

  .content p { margin-bottom: 10px; }

  .content ul {
    padding-left: 18px;
    margin-bottom: 10px;
  }

  .content li {
    margin-bottom: 4px;
    color: var(--text);
  }

  .content strong { color: var(--text); font-weight: 600; }

  /* Risk tags */
  .risk-card {
    border-left: 2px solid var(--red);
  }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
  }

  .empty-icon {
    font-size: 40px;
    margin-bottom: 16px;
    opacity: 0.5;
  }

  .empty-state p {
    color: var(--text-muted);
    font-size: 14px;
  }

  .empty-state .hint {
    font-size: 12px;
    margin-top: 8px;
    color: var(--text-muted);
    opacity: 0.6;
  }

  /* Footer */
  .footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border-subtle);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-muted);
  }

  .footer .disclaimer {
    max-width: 500px;
    line-height: 1.5;
  }

  .footer .timestamp {
    font-family: var(--mono);
    white-space: nowrap;
  }

  /* Convention note */
  .convention {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 12px;
    padding: 4px 10px;
    background: var(--bg-hover);
    border-radius: 20px;
  }

  .dot-red { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .dot-green { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }

  /* Mobile */
  @media (max-width: 640px) {
    header { flex-direction: column; gap: 16px; align-items: flex-start; }
    .stock-grid { grid-template-columns: 1fr; }
    .tab-bar { width: 100%; }
    .tab { flex: 1; text-align: center; }
    .footer { flex-direction: column; gap: 12px; text-align: center; }
  }
</style>
</head>
<body>

<!-- Password Lock -->
<div id="lockScreen">
  <form id="pinForm" onsubmit="return false;" style="display:flex;flex-direction:column;align-items:center;gap:20px;">
    <div class="brand-icon" style="width:48px;height:48px;"><svg viewBox="0 0 36 36" width="48" height="48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 4 C18 4 22 10 22 18 C22 24 20 28 18 32 C16 28 10 22 10 18 C10 12 15 6 18 4Z" fill="#1a1a1a" opacity="0.85"/><ellipse cx="18" cy="28" rx="10" ry="2" fill="#1a1a1a" opacity="0.15"/></svg></div>
    <label for="pinCode" style="font-size:14px;color:var(--text-secondary);">输入密码访问</label>
    <input type="tel" id="pinCode" name="pin" maxlength="4" inputmode="numeric" autocomplete="off"
      placeholder="····" autofocus>
    <button type="submit" id="pinSubmit">进入</button>
    <div id="pinError">密码错误</div>
  </form>
</div>

<style>
  #lockScreen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    z-index: 9999;
  }
  #lockScreen.hidden { display: none; }
  #pinCode {
    width: 200px;
    height: 56px;
    background: var(--bg-elevated);
    border: 2px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    text-align: center;
    letter-spacing: 12px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  #pinCode:focus { border-color: var(--gold); }
  #pinCode.error { border-color: var(--red); animation: shake 400ms; }
  #pinSubmit {
    padding: 10px 36px;
    background: var(--gold);
    color: #1a1a1a;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    -webkit-appearance: none;
  }
  #pinError { font-size:12px; color:var(--red); opacity:0; transition:opacity 200ms; }
  #pinError.show { opacity:1; }
  @keyframes shake {
    0%,100% { transform:translateX(0); }
    25% { transform:translateX(-6px); }
    75% { transform:translateX(6px); }
  }
</style>

<script>
(function() {
  var stored = sessionStorage.getItem('fin_auth');
  if (stored === 'ok') {
    document.getElementById('lockScreen').classList.add('hidden');
    return;
  }

  var input = document.getElementById('pinCode');
  var form = document.getElementById('pinForm');
  var err = document.getElementById('pinError');

  // Focus on load
  setTimeout(function() { input.focus(); input.click(); }, 300);

  input.addEventListener('input', function() {
    input.value = input.value.replace(/[^0-9]/g, '').slice(0, 4);
    if (input.value.length === 4) verify();
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    verify();
  });

  function verify() {
    var code = input.value;
    if (code.length < 4) return;
    crypto.subtle.digest('SHA-256', new TextEncoder().encode(code)).then(function(buf) {
      var hash = Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2,'0'); }).join('');
      if (hash === 'a11f793d5f24841552b2befc8d946d9f7e5652edfb58bd49c3a8423a6031c952') {
        sessionStorage.setItem('fin_auth', 'ok');
        document.getElementById('lockScreen').classList.add('hidden');
      } else {
        err.classList.add('show');
        input.value = '';
        input.classList.add('error');
        setTimeout(function() {
          input.classList.remove('error');
          err.classList.remove('show');
          input.focus();
        }, 1500);
      }
    });
  }
})();
</script>

<div class="container">
  <header>
    <div class="brand">
      <div class="brand-icon"><svg viewBox="0 0 36 36" width="36" height="36" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="fin-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a1a1a" stop-opacity="0.9"/><stop offset="100%" stop-color="#1a1a1a" stop-opacity="0.7"/></linearGradient></defs><path d="M18 4 C18 4 22 10 22 18 C22 24 20 28 18 32 C16 28 10 22 10 18 C10 12 15 6 18 4Z" fill="url(#fin-g)"/><ellipse cx="18" cy="28" rx="10" ry="2" fill="#1a1a1a" opacity="0.15"/></svg></div>
      <div>
        <h1><span>Fin</span> Dashboard</h1>
        <div class="subtitle">你的持仓，我来盯。</div>
      </div>
    </div>
    <div class="date-nav">
      <button onclick="changeDate(-1)"><i data-lucide="chevron-left" style="width:16px;height:16px"></i></button>
      <div class="current-date" id="currentDate"></div>
      <button onclick="changeDate(1)"><i data-lucide="chevron-right" style="width:16px;height:16px"></i></button>
    </div>
  </header>

  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('pre')" id="tab-pre">☀ 盘前</button>
    <button class="tab" onclick="switchTab('post')" id="tab-post">☽ 盘后</button>
    <button class="tab" onclick="switchTab('macro')" id="tab-macro">🌐 宏观</button>
    <button class="tab" onclick="switchTab('picks')" id="tab-picks">🎯 短线</button>
    <button class="tab" onclick="switchTab('longterm')" id="tab-longterm">🏦 中长线</button>
  </div>

  <div id="report-content">
    <div class="empty-state">
      <div class="empty-icon">◌</div>
      <p>加载中...</p>
    </div>
  </div>

  <div class="footer" id="footer" style="display:none">
    <div class="disclaimer">⚠ 数据仅供参考，不构成投资建议。投资有风险，决策需谨慎。</div>
    <div class="timestamp" id="reportTimestamp"></div>
  </div>
</div>

<script>
const REPORTS_DIR = './reports/';
let currentDate = new Date();
let currentTab = 'pre';

function getShanghaiDate(d) {
  const utc = d.getTime() + d.getTimezoneOffset() * 60000;
  return new Date(utc + 8 * 60 * 60000);
}

function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDisplayDate(d) {
  const w = ['日','一','二','三','四','五','六'];
  return `${formatDate(d)}  周${w[d.getDay()]}`;
}

function changeDate(delta) {
  currentDate.setDate(currentDate.getDate() + delta);
  loadReport();
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-pre').classList.toggle('active', tab === 'pre');
  document.getElementById('tab-post').classList.toggle('active', tab === 'post');
  document.getElementById('tab-macro').classList.toggle('active', tab === 'macro');
  document.getElementById('tab-picks').classList.toggle('active', tab === 'picks');
  document.getElementById('tab-longterm').classList.toggle('active', tab === 'longterm');
  loadReport();
}

async function loadReport() {
  const dateStr = formatDate(currentDate);
  document.getElementById('currentDate').textContent = formatDisplayDate(currentDate);
  const tabFile = currentTab === 'pre' ? 'morning' : currentTab === 'post' ? 'afternoon' : 'macro';
  const filename = `${dateStr}-${tabFile}.json`;
  const container = document.getElementById('report-content');
  const footer = document.getElementById('footer');

  try {
    if (currentTab === 'picks') {
      const resp = await fetch(REPORTS_DIR + 'picks.json');
      if (!resp.ok) throw new Error('Not found');
      const data = await resp.json();
      renderPicks(data);
      footer.style.display = 'flex';
      document.getElementById('reportTimestamp').textContent = '短线推荐';
      return;
    }
    if (currentTab === 'longterm') {
      // Try today first, then find latest
      let ltData = null;
      for (let d = 0; d < 7; d++) {
        const dd = new Date(); dd.setDate(dd.getDate() - d);
        const ds = formatDate(getShanghaiDate(dd));
        try {
          const resp = await fetch(REPORTS_DIR + `longterm-screener-${ds}.json`);
          if (resp.ok) { ltData = await resp.json(); break; }
        } catch(e) {}
      }
      if (!ltData) throw new Error('Not found');
      renderLongterm(ltData);
      footer.style.display = 'flex';
      document.getElementById('reportTimestamp').textContent = `中长线筛选 ${ltData.date || ''}`;
      return;
    }
    const resp = await fetch(REPORTS_DIR + filename);
    if (!resp.ok) throw new Error('Not found');
    const data = await resp.json();
    renderReport(data);
    footer.style.display = 'flex';
    document.getElementById('reportTimestamp').textContent = data.timestamp || '';
  } catch (e) {
    footer.style.display = 'none';
    if (currentTab === 'picks') {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🎯</div>
          <p>短线推荐记录加载失败</p>
          <div class="hint">如使用 file:// 打开，请改用 http 服务：python3 -m http.server 8080</div>
        </div>`;
    } else if (currentTab === 'longterm') {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🏦</div>
          <p>中长线筛选数据还没生成</p>
          <div class="hint">每周一 20:00 自动更新</div>
        </div>`;
    } else {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">${currentTab === 'pre' ? '☀' : currentTab === 'post' ? '☽' : '🌐'}</div>
          <p>${dateStr} 的${currentTab === 'pre' ? '盘前' : currentTab === 'post' ? '盘后' : '宏观'}报告还没生成</p>
          <div class="hint">交易日自动更新</div>
        </div>`;
    }
  }
}

function renderReport(data) {
  const container = document.getElementById('report-content');
  let html = '';

  if (data.market) {
    html += `
    <div class="section" style="animation-delay:0ms">
      <div class="section-header"><i data-lucide="bar-chart-3"></i> 大盘概况</div>
      <div class="card"><div class="content">${data.market}</div></div>
    </div>`;
  }

  if (data.stocks && data.stocks.length) {
    html += `
    <div class="section" style="animation-delay:80ms">
      <div class="section-header"><i data-lucide="briefcase"></i> 持仓表现</div>
      <div class="stock-grid">
        ${data.stocks.map(s => {
          const cls = s.change > 0 ? 'up' : s.change < 0 ? 'down' : 'flat';
          const sign = s.change > 0 ? '+' : '';
          return `
          <div class="stock-card ${cls}">
            <div class="stock-top">
              <div>
                <div class="stock-name">${s.name}</div>
                <div class="stock-code">${s.code}</div>
              </div>
              <div>
                <div class="stock-price">${s.price || '—'}</div>
                <div class="stock-change">${sign}${s.change || 0}%</div>
              </div>
            </div>
            ${s.note ? `<div class="stock-note">${s.note}</div>` : ''}
          </div>`;
        }).join('')}
      </div>
      <div class="convention">
        <span class="dot-red"></span> 涨
        <span class="dot-green"></span> 跌
        <span style="margin-left:4px">A股惯例</span>
      </div>
    </div>`;
  }

  if (data.analysis) {
    html += `
    <div class="section" style="animation-delay:160ms">
      <div class="section-header"><i data-lucide="lightbulb"></i> 分析与建议</div>
      <div class="card"><div class="content">${data.analysis}</div></div>
    </div>`;
  }

  if (data.risks) {
    html += `
    <div class="section" style="animation-delay:240ms">
      <div class="section-header"><i data-lucide="alert-triangle"></i> 风险提示</div>
      <div class="card risk-card"><div class="content">${data.risks}</div></div>
    </div>`;
  }

  // Macro-specific sections
  if (data.indicators) {
    html += `
    <div class="section" style="animation-delay:0ms">
      <div class="section-header"><i data-lucide="activity"></i> 宏观数据</div>
      <div class="card"><div class="content">${data.indicators}</div></div>
    </div>`;
  }

  if (data.sentiment) {
    html += `
    <div class="section" style="animation-delay:80ms">
      <div class="section-header"><i data-lucide="gauge"></i> 市场情绪</div>
      <div class="card"><div class="content">${data.sentiment}</div></div>
    </div>`;
  }

  if (data.policy) {
    html += `
    <div class="section" style="animation-delay:160ms">
      <div class="section-header"><i data-lucide="landmark"></i> 政策动向</div>
      <div class="card"><div class="content">${data.policy}</div></div>
    </div>`;
  }

  if (data.conclusion) {
    html += `
    <div class="section" style="animation-delay:240ms">
      <div class="section-header"><i data-lucide="target"></i> 综合判断</div>
      <div class="card"><div class="content">${data.conclusion}</div></div>
    </div>`;
  }

  container.innerHTML = html;
  lucide.createIcons();
}

function renderPicks(data) {
  const container = document.getElementById('report-content');
  if (!data.picks || !data.picks.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🎯</div>
        <p>还没有推荐记录</p>
        <div class="hint">短线选股筛选后会自动添加</div>
      </div>`;
    return;
  }

  // Sort: active first (no exitDate), then by date desc
  const sorted = [...data.picks].sort((a, b) => {
    if (!a.exitDate && b.exitDate) return -1;
    if (a.exitDate && !b.exitDate) return 1;
    return new Date(b.date) - new Date(a.date);
  });

  const active = sorted.filter(p => !p.exitDate);
  const closed = sorted.filter(p => p.exitDate);

  let html = '';

  if (active.length) {
    html += `
    <div class="section">
      <div class="section-header"><i data-lucide="target"></i> 持续跟踪中 (${active.length})</div>
      <div class="stock-grid">
        ${active.map(p => renderPickCard(p)).join('')}
      </div>
    </div>`;
  }

  if (closed.length) {
    html += `
    <div class="section">
      <div class="section-header"><i data-lucide="archive"></i> 已结束 (${closed.length})</div>
      <div class="stock-grid">
        ${closed.map(p => renderPickCard(p)).join('')}
      </div>
    </div>`;
  }

  // Stats
  const totalPicks = data.picks.length;
  const activePicks = data.picks.filter(p => !p.exitDate);
  const wins = data.picks.filter(p => (p.currentChange || 0) > 0).length;
  const winRate = totalPicks ? (wins / totalPicks * 100).toFixed(0) : 0;
  const avgReturn = totalPicks
    ? (data.picks.reduce((s, p) => s + (p.currentChange || 0), 0) / totalPicks).toFixed(2)
    : 0;
  const buyCount = data.picks.filter(p => p.rating === 'buy' && !p.exitDate).length;
  const totalReturn = data.picks.reduce((s, p) => s + (p.currentChange || 0), 0).toFixed(2);

  html += `
  <div class="section">
    <div class="section-header"><i data-lucide="bar-chart-3"></i> 推荐统计</div>
    <div class="card">
      <div class="content" style="display:flex;gap:32px;flex-wrap:wrap;">
        <div><strong>总推荐</strong><br><span style="font-family:var(--mono);font-size:20px;">${totalPicks}</span></div>
        <div><strong>跟踪中</strong><br><span style="font-family:var(--mono);font-size:20px;color:var(--gold);">${activePicks.length}</span></div>
        <div><strong>买入评级</strong><br><span style="font-family:var(--mono);font-size:20px;color:#ef4444;">${buyCount}</span></div>
        <div><strong>胜率</strong><br><span style="font-family:var(--mono);font-size:20px;color:${winRate >= 50 ? 'var(--red)' : 'var(--green)'};">${winRate}%</span></div>
        <div><strong>平均收益</strong><br><span style="font-family:var(--mono);font-size:20px;color:${avgReturn >= 0 ? 'var(--red)' : 'var(--green)'};">${avgReturn > 0 ? '+' : ''}${avgReturn}%</span></div>
        <div><strong>累计收益</strong><br><span style="font-family:var(--mono);font-size:20px;color:${totalReturn >= 0 ? 'var(--red)' : 'var(--green)'};">${totalReturn > 0 ? '+' : ''}${totalReturn}%</span></div>
      </div>
    </div>
  </div>`;

  container.innerHTML = html;
  lucide.createIcons();
}

function renderPickCard(p) {
  const change = p.currentChange || 0;
  const cls = change > 0 ? 'up' : change < 0 ? 'down' : 'flat';
  const sign = change > 0 ? '+' : '';
  const days = Math.floor((new Date() - new Date(p.date)) / 86400000);

  // Rating badge
  const ratingMap = {
    'buy': { label: '买入', color: '#ef4444', bg: 'rgba(239,68,68,0.15)' },
    'hold': { label: '观望', color: '#eab308', bg: 'rgba(234,179,8,0.15)' },
    'avoid': { label: '回避', color: '#6b7280', bg: 'rgba(107,114,128,0.15)' },
    'closed': { label: '已结束', color: '#6b7280', bg: 'rgba(107,114,128,0.15)' },
  };
  const rating = ratingMap[p.rating] || ratingMap['hold'];

  // Confidence bar
  const conf = p.confidence || 0;
  const confPct = Math.round(conf * 100);
  const confColor = conf >= 0.7 ? '#ef4444' : conf >= 0.5 ? '#eab308' : '#6b7280';

  // Profit from pick price
  const profitPct = p.pickPrice ? ((p.currentPrice || p.pickPrice) / p.pickPrice - 1) * 100 : 0;
  const profitSign = profitPct > 0 ? '+' : '';
  const profitColor = profitPct > 0 ? 'var(--red)' : profitPct < 0 ? 'var(--green)' : 'var(--muted)';

  // Reasons & risks
  const reasons = (p.reasons || []).slice(0, 3);
  const risks = (p.risks || []).slice(0, 2);

  // Target & stop loss progress
  let targetHtml = '';
  if (p.targetPrice && p.stopLoss && p.currentPrice) {
    const range = p.targetPrice - p.stopLoss;
    const pos = Math.max(0, Math.min(1, (p.currentPrice - p.stopLoss) / range));
    const pickPos = Math.max(0, Math.min(1, (p.pickPrice - p.stopLoss) / range));
    targetHtml = `
      <div style="margin-top:10px;">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);">
          <span>止损 ${p.stopLoss}</span>
          <span>目标 ${p.targetPrice}</span>
        </div>
        <div style="position:relative;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;margin-top:4px;">
          <div style="position:absolute;left:${pickPos*100}%;top:-2px;width:2px;height:10px;background:var(--muted);border-radius:1px;" title="推荐价"></div>
          <div style="position:absolute;left:0;top:0;height:100%;width:${pos*100}%;background:linear-gradient(90deg,var(--green),${pos > pickPos ? 'var(--red)' : 'var(--green)'});border-radius:3px;transition:width 0.3s;"></div>
        </div>
      </div>`;
  }

  return `
  <div class="stock-card ${cls}" style="position:relative;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <div class="stock-name"><a href="https://xueqiu.com/S/${p.code.startsWith('6') ? 'SH' : 'SZ'}${p.code}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;border-bottom:1px dashed rgba(255,255,255,0.2);">${p.name}</a></div>
        <div class="stock-code"><a href="https://quote.eastmoney.com/${p.code.startsWith('6') ? 'sh' : 'sz'}${p.code}.html" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;">${p.code} ↗</a></div>
      </div>
      <div style="text-align:right;">
        <span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;color:${rating.color};background:${rating.bg};">${rating.label}</span>
        ${conf ? `<div style="font-size:11px;color:var(--muted);margin-top:4px;">信心 <span style="color:${confColor};font-weight:600;">${confPct}%</span></div>` : ''}
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;">
      <div>
        <span style="font-family:var(--mono);font-size:28px;font-weight:700;">${p.currentPrice || p.pickPrice || '—'}</span>
        <span class="stock-change" style="font-size:14px;margin-left:8px;">${sign}${change}%</span>
      </div>
      <div style="text-align:right;">
        <div style="font-size:11px;color:var(--muted);">推荐收益</div>
        <div style="font-family:var(--mono);font-size:18px;font-weight:600;color:${profitColor};">${profitSign}${profitPct.toFixed(2)}%</div>
      </div>
    </div>
    <div style="display:flex;gap:12px;margin-top:8px;font-size:12px;color:var(--muted);">
      <span>推荐价 <strong style="color:var(--text);">${p.pickPrice}</strong></span>
      <span>${p.date}</span>
      <span>${days}天</span>
      ${p.holdDays ? `<span>建议持有${p.holdDays}天</span>` : ''}
    </div>
    ${targetHtml}
    ${reasons.length ? `
    <div style="margin-top:10px;">
      <div style="font-size:11px;color:var(--gold);margin-bottom:4px;">📈 推荐理由</div>
      ${reasons.map(r => `<div style="font-size:12px;color:var(--text);padding-left:8px;border-left:2px solid var(--gold);margin-bottom:3px;">${r}</div>`).join('')}
    </div>` : ''}
    ${risks.length ? `
    <div style="margin-top:8px;">
      <div style="font-size:11px;color:#ef4444;margin-bottom:4px;">⚠️ 风险提示</div>
      ${risks.map(r => `<div style="font-size:12px;color:var(--muted);padding-left:8px;border-left:2px solid rgba(239,68,68,0.3);margin-bottom:3px;">${r}</div>`).join('')}
    </div>` : ''}
    ${p.reason && !reasons.length ? `<div style="margin-top:8px;font-size:12px;color:var(--muted);">${p.reason}</div>` : ''}
    ${p.exitDate ? `<div style="margin-top:8px;padding:4px 8px;background:rgba(107,114,128,0.1);border-radius:4px;font-size:12px;color:var(--muted);">🏁 ${p.exitDate} 退出 ${p.exitReason ? '· ' + p.exitReason : ''}</div>` : ''}
  </div>`;
}

function renderLongterm(data) {
  const container = document.getElementById('report-content');
  const candidates = data.candidates || [];
  if (!candidates.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🏦</div>
        <p>本期无符合条件的中长线标的</p>
      </div>`;
    return;
  }

  // Sort: analyzed first (strong_buy > buy > hold > avoid), then by score
  const ratingOrder = {'strong_buy': 0, 'buy': 1, 'hold': 2, 'avoid': 3};
  candidates.sort((a, b) => {
    const ra = a.rating ? ratingOrder[a.rating] ?? 2 : 9;
    const rb = b.rating ? ratingOrder[b.rating] ?? 2 : 9;
    if (ra !== rb) return ra - rb;
    return (b.score || 0) - (a.score || 0);
  });
  const top = candidates.slice(0, 20);

  let html = '';

  // Market view & portfolio suggestion
  if (data.market_view || data.portfolio_suggestion) {
    html += `
    <div class="section">
      <div class="section-header"><i data-lucide="compass"></i> 市场判断</div>
      <div class="card"><div class="content">
        ${data.market_view ? `<div style="margin-bottom:8px;">${data.market_view}</div>` : ''}
        ${data.sector_view ? `<div style="margin-bottom:8px;color:var(--text-secondary);">📊 ${data.sector_view}</div>` : ''}
        ${data.portfolio_suggestion ? `<div style="padding:8px 12px;background:var(--gold-glow);border-radius:6px;border-left:3px solid var(--gold);"><strong style="color:var(--gold);">💰 组合建议：</strong> ${data.portfolio_suggestion}</div>` : ''}
      </div></div>
    </div>`;
  }

  html += `
  <div class="section">
    <div class="section-header"><i data-lucide="filter"></i> 筛选概览</div>
    <div class="card">
      <div class="content" style="display:flex;gap:32px;flex-wrap:wrap;">
        <div><strong>股票池</strong><br><span style="font-family:var(--mono);font-size:20px;">${data.pool || '—'}</span></div>
        <div><strong>扫描</strong><br><span style="font-family:var(--mono);font-size:20px;">${data.total_screened || '—'}</span></div>
        <div><strong>通过</strong><br><span style="font-family:var(--mono);font-size:20px;color:var(--gold);">${data.passed || candidates.length}</span></div>
        <div><strong>日期</strong><br><span style="font-family:var(--mono);font-size:16px;">${data.date || '—'}</span></div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="section-header"><i data-lucide="trophy"></i> 基本面 Top 20</div>
    <div class="stock-grid">
      ${top.map(c => renderLongtermCard(c)).join('')}
    </div>
  </div>`;

  container.innerHTML = html;
  lucide.createIcons();
}

function renderLongtermCard(c) {
  const score = c.score || 0;
  const scoreColor = score >= 10 ? '#ef4444' : score >= 8 ? '#eab308' : 'var(--text-secondary)';
  const reasons = c.reasons || [];
  const risks = c.risks || [];

  const revenue = c.revenue ? (c.revenue >= 1e8 ? (c.revenue / 1e8).toFixed(0) + '亿' : (c.revenue / 1e4).toFixed(0) + '万') : '—';
  const profit = c.net_profit ? (c.net_profit >= 1e8 ? (c.net_profit / 1e8).toFixed(0) + '亿' : (c.net_profit / 1e4).toFixed(0) + '万') : '—';
  const mcap = c.market_cap ? (c.market_cap >= 1e4 ? (c.market_cap / 1e4).toFixed(0) + '万亿' : c.market_cap.toFixed(0) + '亿') : '—';

  // Auto-rating from analyst result or score-based
  let rating = c.rating;
  if (!rating) {
    if (score >= 10) rating = 'strong_buy';
    else if (score >= 8) rating = 'buy';
    else if (score >= 6) rating = 'hold';
    else rating = 'avoid';
  }
  const ratingMap = {
    'strong_buy': { label: '强烈推荐', color: '#ef4444', bg: 'rgba(239,68,68,0.2)' },
    'buy': { label: '推荐买入', color: '#ef4444', bg: 'rgba(239,68,68,0.15)' },
    'hold': { label: '观望', color: '#eab308', bg: 'rgba(234,179,8,0.15)' },
    'avoid': { label: '回避', color: '#6b7280', bg: 'rgba(107,114,128,0.15)' },
  };
  const ratingInfo = ratingMap[rating] || ratingMap['hold'];

  // Price change since screening (if currentPrice available from live data)
  const screenPrice = c.price || 0;
  const currentPrice = c.currentPrice || c.price || 0;
  const pricePct = screenPrice ? ((currentPrice / screenPrice - 1) * 100) : 0;
  const priceSign = pricePct > 0 ? '+' : '';
  const priceColor = pricePct > 0 ? 'var(--red)' : pricePct < 0 ? 'var(--green)' : 'var(--muted)';

  return `
  <div class="stock-card" style="position:relative;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <div class="stock-name"><a href="https://xueqiu.com/S/${c.code.startsWith('6') ? 'SH' : 'SZ'}${c.code}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;border-bottom:1px dashed rgba(255,255,255,0.2);">${c.name}</a></div>
        <div class="stock-code"><a href="https://quote.eastmoney.com/${c.code.startsWith('6') ? 'sh' : 'sz'}${c.code}.html" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;">${c.code} ↗</a></div>
      </div>
      <div style="text-align:right;">
        <span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;color:${ratingInfo.color};background:${ratingInfo.bg};">${ratingInfo.label}</span>
        <div style="font-family:var(--mono);font-size:24px;font-weight:700;color:${scoreColor};margin-top:4px;">${score}</div>
        <div style="font-size:10px;color:var(--muted);">基本面得分</div>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;">
      <div>
        <span style="font-family:var(--mono);font-size:24px;font-weight:700;">${currentPrice || '—'}</span>
      </div>
      <div style="text-align:right;">
        <div style="font-size:11px;color:var(--muted);">筛选以来</div>
        <div style="font-family:var(--mono);font-size:16px;font-weight:600;color:${priceColor};">${priceSign}${pricePct.toFixed(2)}%</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:12px;font-size:12px;">
      <div><span style="color:var(--muted);">ROE</span> <strong style="color:${(c.roe||0) > 20 ? 'var(--red)' : 'var(--text)'};">${c.roe || '—'}%</strong></div>
      <div><span style="color:var(--muted);">PE</span> <strong style="color:${(c.pe||99) < 20 ? 'var(--gold)' : 'var(--text)'};">${c.pe ? c.pe.toFixed(1) : '—'}</strong></div>
      <div><span style="color:var(--muted);">毛利率</span> <strong>${c.gross_margin || '—'}%</strong></div>
      <div><span style="color:var(--muted);">净利率</span> <strong>${c.net_margin || '—'}%</strong></div>
      <div><span style="color:var(--muted);">营收增速</span> <strong style="color:${(c.revenue_growth||0) > 15 ? 'var(--red)' : 'var(--text)'};">${c.revenue_growth || '—'}%</strong></div>
      <div><span style="color:var(--muted);">负债率</span> <strong>${c.debt_ratio || '—'}%</strong></div>
      <div><span style="color:var(--muted);">营收</span> <strong>${revenue}</strong></div>
      <div><span style="color:var(--muted);">净利</span> <strong>${profit}</strong></div>
    </div>
    <div style="display:flex;gap:12px;margin-top:8px;font-size:12px;color:var(--muted);">
      <span>市值 ${mcap}</span>
      <span>价格 <strong style="color:var(--text);">${c.price || '—'}</strong></span>
      ${c.report_period ? `<span>${c.report_period}</span>` : ''}
    </div>
    ${reasons.length ? `
    <div style="margin-top:8px;">
      ${reasons.map(r => `<span style="display:inline-block;margin:2px 4px 2px 0;padding:2px 6px;border-radius:3px;font-size:11px;background:var(--gold-glow);color:var(--gold);">${r}</span>`).join('')}
    </div>` : ''}
    ${risks.length ? `
    <div style="margin-top:4px;">
      ${risks.map(r => `<span style="display:inline-block;margin:2px 4px 2px 0;padding:2px 6px;border-radius:3px;font-size:11px;background:var(--red-bg);color:var(--red);">${r}</span>`).join('')}
    </div>` : ''}
    ${c.moat ? `<div style="margin-top:6px;font-size:11px;color:var(--text-secondary);"><span style="color:var(--gold);">🏰</span> ${c.moat}</div>` : ''}
    ${c.catalyst ? `<div style="margin-top:3px;font-size:11px;color:var(--text-secondary);"><span style="color:var(--blue);">⚡</span> ${c.catalyst}</div>` : ''}
    ${c.target_price_12m && c.stop_loss ? (() => {
      const tp = c.target_price_12m;
      const sl = c.stop_loss;
      const cp = currentPrice || screenPrice;
      const range = tp - sl;
      const pos = range > 0 ? Math.max(0, Math.min(1, (cp - sl) / range)) : 0.5;
      const entryLow = c.entry_zone ? c.entry_zone[0] : null;
      const entryHigh = c.entry_zone ? c.entry_zone[1] : null;
      const entryPos1 = entryLow && range > 0 ? Math.max(0, Math.min(1, (entryLow - sl) / range)) : null;
      const entryPos2 = entryHigh && range > 0 ? Math.max(0, Math.min(1, (entryHigh - sl) / range)) : null;
      return `
      <div style="margin-top:10px;">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);">
          <span>止损 ${sl}</span>
          ${c.entry_zone ? `<span style="color:var(--gold);">介入 ${entryLow}-${entryHigh}</span>` : ''}
          <span>目标 ${tp}</span>
        </div>
        <div style="position:relative;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;margin-top:4px;">
          ${entryPos1 !== null ? `<div style="position:absolute;left:${entryPos1*100}%;width:${(entryPos2-entryPos1)*100}%;top:0;height:100%;background:var(--gold-glow);border-radius:3px;"></div>` : ''}
          <div style="position:absolute;left:0;top:0;height:100%;width:${pos*100}%;background:linear-gradient(90deg,var(--green),var(--red));border-radius:3px;transition:width 0.3s;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--muted);">
          ${c.hold_months ? `<span>持有 ${c.hold_months} 个月</span>` : '<span></span>'}
          ${c.upside_pct ? `<span style="color:var(--red);">空间 +${c.upside_pct}%</span>` : ''}
          ${c.valuation_method ? `<span>${c.valuation_method}</span>` : ''}
        </div>
      </div>`;
    })() : (c.hold_months ? `<div style="margin-top:6px;font-size:11px;color:var(--muted);">建议持有 ${c.hold_months} 个月</div>` : '')}
  </div>`;
}

currentDate = getShanghaiDate(new Date());
loadReport();
lucide.createIcons();
</script>
</body>
</html>
